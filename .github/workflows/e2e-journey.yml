name: E2E journey tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      suite:
        description: Test suite
        type: choice
        options: [regression, smoke]
        default: regression
      environment:
        description: GitHub environment holding the URLs and credentials
        type: string
        default: test

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: '20'
  JUNIT_FILE: reports/junit/results.xml
  A11Y_DIR: reports/a11y
  PW_REPORT_DIR: reports/playwright

jobs:
  e2e:
    name: E2E (${{ matrix.profile }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || vars.E2E_ENVIRONMENT || 'test' }}
    timeout-minutes: 60
    defaults:
      run:
        working-directory: test/journey
    strategy:
      fail-fast: false
      matrix:
        profile: ${{ fromJSON(vars.E2E_PROFILES || '["legacy"]') }}
    steps:
      - name: Get source
        uses: actions/checkout@v7
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: test/journey/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install browsers
        run: npx playwright install --with-deps chromium
      - name: Check required settings
        env:
          PROFICIENCY_TESTING_EXTERNAL_WEB_URL: ${{ vars.PROFICIENCY_TESTING_EXTERNAL_WEB_URL }}
          PROFICIENCY_TESTING_WEB_URL: ${{ vars.PROFICIENCY_TESTING_WEB_URL }}
        run: |
          for name in PROFICIENCY_TESTING_EXTERNAL_WEB_URL PROFICIENCY_TESTING_WEB_URL; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository variable $name is not set."
              exit 1
            fi
          done
      - name: Select suite
        id: suite
        env:
          EVENT: ${{ github.event_name }}
          INPUT_SUITE: ${{ inputs.suite }}
        run: |
          if [ "$EVENT" = "pull_request" ] || [ "$INPUT_SUITE" = "smoke" ]; then
            echo "grep=@smoke" >> "$GITHUB_OUTPUT"
          else
            echo "grep=" >> "$GITHUB_OUTPUT"
          fi
      - name: Check test-case traceability
        run: node scripts/trace-check.js
      - name: Run tests
        env:
          CI: 'true'
          UI_PROFILE: ${{ matrix.profile }}
          PROFICIENCY_TESTING_EXTERNAL_WEB_URL: ${{ vars.PROFICIENCY_TESTING_EXTERNAL_WEB_URL }}
          PROFICIENCY_TESTING_WEB_URL: ${{ vars.PROFICIENCY_TESTING_WEB_URL }}
          EXTERNAL_WEB_APPLICANT_USER: ${{ vars.EXTERNAL_WEB_APPLICANT_USER }}
          EXTERNAL_WEB_APPLICANT_PASSWORD: ${{ secrets.EXTERNAL_WEB_APPLICANT_PASSWORD }}
          PW_GREP: ${{ steps.suite.outputs.grep }}
          PLAYWRIGHT_JUNIT_OUTPUT_FILE: ${{ env.JUNIT_FILE }}
        run: npx bddgen && npx playwright test ${PW_GREP:+--grep "$PW_GREP"}
      - name: Build accessibility report
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: npm run a11y:report
      - name: Upload JUnit results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: junit-results-${{ matrix.profile }}
          path: test/journey/${{ env.JUNIT_FILE }}
          if-no-files-found: error
          retention-days: 30
      - name: Upload accessibility report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: accessibility-report-${{ matrix.profile }}
          path: test/journey/${{ env.A11Y_DIR }}
          if-no-files-found: warn
          retention-days: 30
      - name: Upload failure diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: failure-diagnostics-${{ matrix.profile }}
          path: |
            test/journey/${{ env.PW_REPORT_DIR }}
            test/journey/test-results
          if-no-files-found: ignore
          retention-days: 7
      - name: Write run summary
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          UI_PROFILE: ${{ matrix.profile }}
          JUNIT_FILE: ${{ env.JUNIT_FILE }}
          A11Y_DIR: ${{ env.A11Y_DIR }}
        run: node scripts/ci-summary.js
